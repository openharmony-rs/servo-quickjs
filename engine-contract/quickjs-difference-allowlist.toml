    "fields.shared_flag",
    "fields.shared_len",
    "fields.sharedness",
]
reason = "QuickJS supports SharedArrayBuffer and SharedArrayBuffer-backed views; this SpiderMonkey build reports shared memory as unavailable"
owner = "servo-quickjs"
