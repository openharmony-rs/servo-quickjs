# Known QuickJS defects relative to the SpiderMonkey contract.
#
# SpiderMonkey is the reference implementation. Each entry names one case and what may differ in
# it. The comparison still prints every known defect; an unlisted difference fails the run. Never
# add an entry merely to silence a failure, and remove it when the shim is fixed.
#
# fields:   the record keys that may differ: `apis`, `exception`, or one observation field as
#           `fields.<name>`. Every other field recorded by both engines is still compared, and a
#           listed field that no longer differs fails as stale. Optional when `panic` covers the
#           whole difference.
#
# status:   pending | bug | known-bug | accepted | wontfix. accepted and wontfix are released as
#           accepted behaviour differences, and known-bug is released as a shim defect that is
#           tracked by an issue; all three keep the gate green but stay visible in the report.
#           pending and bug still fail the comparison.
# severity: P0 | P1 | P2 | P3. P0 and P1 cannot be released as accepted/wontfix/known-bug.
#
# Optional: `issue` links the tracking issue for a difference that is still present. `pending`,
# `bug` and `known-bug` entries must name a real tracking issue; accepted/wontfix entries may
# omit it.
#
# Optional: `steps` names the sub-scenarios that fail on QuickJS, and needs `panic`. It must equal
# the steps in `fields.step_failures`: a newly failing step, or a listed step that passes again,
# fails the comparison.
#
# Optional: `panic` is an exact QuickJS panic fingerprint (for a `Steps` case, the first failing
# step's panic). A panicking case stops recording and a failed step drops its observations, so
# the fields QuickJS did not record are accepted only behind a matching `panic`. Panic text that
# changes, or a panic where none is listed, fails the comparison. When a difference is fixed, add
# a record to
# `quickjs-shim-fix-records.md`, then
# delete the entry here.

[[difference]]
id = "rooter.trace_on_gc"
panic = "the custom rooter trace callback did not run during an explicit collection"
reason = "Accepted ownership difference: QuickJS does not trace Rust roots. docs/design.md:59-62 records that JS_AddExtraGCRootsTracer is a no-op and that Rust-side roots are counted or pooled instead, so a CustomAutoRooter trace callback has nothing to mark and does not run during an explicit collection."
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "eval.environment_chain"
steps = ["environment_chain"]
panic = """assertion `left == right` failed
  left: 12
 right: 13"""
reason = "Known shim defect (tracked in https://github.com/openharmony-rs/servo-ohos/issues/57): QuickJS wraps environment-chain scopes in append order, so a later appended outer scope shadows an earlier inner scope; SpiderMonkey gives earlier appends precedence."
owner = "servo-quickjs"
issue = "https://github.com/openharmony-rs/servo-ohos/issues/57"
status = "known-bug"
severity = "P2"

[[difference]]
id = "objects.core"
fields = ["fields.regexp_syntax_error"]
steps = ["property_keys"]
panic = """assertion `left == right` failed
  left: ([3], 1)
 right: ([], 0)"""
reason = "JSITER_SYMBOLSONLY is a proxy-only flag in SpiderMonkey; QuickJS also treats it as symbol selection for ordinary objects. The RegExp syntax error message is engine wording: QuickJS reports \"expecting ')'\" where SpiderMonkey reports \"unterminated parenthetical\"."
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "strings.core"
steps = ["value_to_source"]
panic = '''assertion `left == right` failed: ValueToSource(({a: 1, 'b c': [2], 3: undefined, [Symbol.iterator]: 0}))
  left: "({3:(void 0), a:1, \"b c\":[2], [Symbol.iterator]:0})"
 right: "({3:(void 0), a:1, 'b c':[2], [Symbol.iterator]:0})"'''
reason = "JS_ValueToSource uses double quotes for property names; SpiderMonkey keeps the source quote style"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "misc.gc_state"
panic = """assertion `left == right` failed
  left: "Object"
 right: "JS Object\""""
reason = "GCTraceKindToAscii returns QuickJS class names such as Object; SpiderMonkey returns JS Object"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "errors.core"
steps = [
    "report_thrown_error_location",
    "report_error_from_exception",
    "stacks",
    "get_saved_frame_column",
    "describe_scripted_caller",
]
panic = """assertion `left == right` failed
  left: (2, 22)
 right: (2, 9)"""
reason = "QuickJS reports the Error construction column; SpiderMonkey reports the throw site column"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "errors.get_scripted_caller_private_api"
fields = ["fields.private"]
reason = "Known shim defect (tracked in #33): JS_GetScriptedCallerPrivate reuses scripted_caller(), which honours HideScriptedCaller (error.rs:103-125), so the private value becomes undefined while the caller is hidden. Servo reads it from string timers (timers.rs:1127) after HideScriptedCaller."
owner = "servo-quickjs"
issue = "https://github.com/openharmony-rs/servo-quickjs/issues/33"
status = "known-bug"
severity = "P2"

[[difference]]
id = "errors.build_stack_string_api"
panic = """assertion `left == right` failed: BuildStackString must format the captured frames
  left: "probeTarget@capture.js:2:8\\n@capture.js:4:12\\n"
 right: "probeTarget@capture.js:2:3\\n@capture.js:4:1\\n\""""
reason = "QuickJS reports the end of the call expression as the saved-frame column; SpiderMonkey reports the call site column"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "edge.eval.compile_and_environment"
panic = """assertion `left == right` failed: inner scope must shadow the later appended outer scope
  left: 12
 right: 13"""
reason = "Known shim defect (tracked in https://github.com/openharmony-rs/servo-ohos/issues/57): QuickJS appends environment-chain scopes in the opposite order; the compiled function therefore sees 12 instead of 13."
owner = "servo-quickjs"
issue = "https://github.com/openharmony-rs/servo-ohos/issues/57"
status = "known-bug"
severity = "P2"

[[difference]]
id = "edge.promise.states_and_queue"
panic = """assertion `left == right` failed: JS_RequestInterruptCallback must schedule the callback once
  left: 0
 right: 1"""
reason = "QuickJS polls its interrupt handler every 10000 bytecode operations, so a requested interrupt is still pending when this 1000-iteration script finishes; the script completes with result 1000 and the callback has not run yet"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

