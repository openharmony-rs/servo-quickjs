[package]
name = "servo-quickjs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Raw bindings to Bellard's QuickJS, vendored with Servo patches"
repository = "https://github.com/openharmony-rs/servo-quickjs"
publish = false
links = "quickjs"
build = "build.rs"

[features]
# The patches for debuggers (Q45 to Q49), which mozjs's emulation of SpiderMonkey's `Debugger`
# needs. `SERVO_QUICKJS_DEBUGGER=1` builds them too.
debugger = []
# Print objects still alive when a runtime is freed (QuickJS DUMP_LEAKS).
dump-leaks = []

[build-dependencies]
cc = "1.2"
