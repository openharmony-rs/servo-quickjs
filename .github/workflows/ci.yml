name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QJS_TARGET_DIR: ${{ github.workspace }}/target
  FUZZ_TARGET_DIR: ${{ github.workspace }}/target/fuzz
  CLANG: clang-18

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo fmt --check
        working-directory: fuzz

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: System ICU, for the Intl subset
        run: pkg-config --exists icu-i18n || (sudo apt-get update && sudo apt-get install -y libicu-dev)
      - name: Bindings match quickjs.h
        run: just check-bindings
      - name: Clippy lints the source denies
        run: just lint
      - name: Tests
        run: just test
      - name: Tests with the tracing verifier
        run: just test-verify
      - name: Tests with autorelease pool statistics
        run: just test-pool-stats --test qjs_pool_stats

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # tools/lsan.supp matches function names, so the sanitizer reports must be symbolized.
      - name: Symbolizer for sanitizer reports
        run: |
          if ! command -v "${CLANG/clang/llvm-symbolizer}" > /dev/null; then
            sudo apt-get update && sudo apt-get install -y "${CLANG/clang/llvm}"
          fi
          symbolizer=$(command -v "${CLANG/clang/llvm-symbolizer}")
          echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
      - name: System ICU, for the Intl subset
        run: pkg-config --exists icu-i18n || (sudo apt-get update && sudo apt-get install -y libicu-dev)
      - name: Tests under ASan, LSan and UBSan
        run: just test-asan
      # Optimized builds lost the pool entries pushed while the pool drains (engine/mod.rs).
      - name: Pool tests in an optimized build under ASan
        run: just test-asan --release --test qjs_pool

  test262:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # run-test262 links clang's own sanitizer runtimes; the Rust tests link Rust's.
      - name: Sanitizer runtimes and symbolizer
        run: |
          if ! echo 'int main(void) { return 0; }' | "$CLANG" -fsanitize=address,undefined -x c - -o /dev/null; then
            sudo apt-get update && sudo apt-get install -y "libclang-rt-${CLANG#clang-}-dev"
          fi
          if ! command -v "${CLANG/clang/llvm-symbolizer}" > /dev/null; then
            sudo apt-get update && sudo apt-get install -y "${CLANG/clang/llvm}"
          fi
          symbolizer=$(command -v "${CLANG/clang/llvm-symbolizer}")
          echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
      - name: test262 under ASan, LSan and UBSan
        run: just test262

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-fuzz
      # tools/lsan.supp matches function names, so the sanitizer reports must be symbolized.
      - name: Symbolizer for sanitizer reports
        run: |
          if ! command -v "${CLANG/clang/llvm-symbolizer}" > /dev/null; then
            sudo apt-get update && sudo apt-get install -y "${CLANG/clang/llvm}"
          fi
          symbolizer=$(command -v "${CLANG/clang/llvm-symbolizer}")
          echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
      - name: System ICU, for the Intl subset
        run: pkg-config --exists icu-i18n || (sudo apt-get update && sudo apt-get install -y libicu-dev)
      - name: Fuzz each target for a minute
        run: just fuzz-smoke 60
